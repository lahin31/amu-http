name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run verify
      - run: npm run size

  typecheck-matrix:
    name: Typecheck (TypeScript ${{ matrix.ts }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ts: ['5.5', '5.8', '6.0']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Pin TypeScript ${{ matrix.ts }}
        run: npm install --no-save typescript@${{ matrix.ts }}
      - run: npx tsc --version
      - run: npm run typecheck
