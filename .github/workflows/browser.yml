name: Browser tests

# Opt-in: triggered manually because Playwright pulls a ~150 MB binary.
# Running this against a release branch (or before tagging) catches streaming /
# Body-mixing / CORS quirks that happy-dom misses.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      # Auto-run only when test-affecting code changes.
      - 'src/**'
      - 'tests/browser/**'
      - 'vitest.browser.config.ts'
      - 'package.json'

jobs:
  browser:
    name: Vitest browser (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps
      - run: npx playwright install chromium --with-deps
      - run: npm run test:browser
